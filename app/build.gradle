plugins {
    id "com.android.application"
}

android {
    namespace "com.voce.seve"
    compileSdk 35

    defaultConfig {
        applicationId "com.voce.seve"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    def generatedWebAssets = layout.buildDirectory.dir("generated/web-assets")
    sourceSets.main.assets.srcDir(generatedWebAssets)

    tasks.register("syncWebAssets", Copy) {
        from(rootProject.projectDir) {
            include "index.html"
            include "mensagem.html"
            include "qrcode.js"
            include "qrcode_UTF8.js"
            include "app-icon.svg"
        }
        into(generatedWebAssets)
    }

    tasks.named("preBuild").configure {
        dependsOn("syncWebAssets")
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
