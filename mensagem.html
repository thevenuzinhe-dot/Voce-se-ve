<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fafaf8">
  <title>Uma mensagem para você</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #fafaf8;
      color: #292927;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 36px 28px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 640px);
      text-align: center;
      animation: arrive 1.4s cubic-bezier(.22, 1, .36, 1) both;
    }

    .eyebrow {
      margin-bottom: 32px;
      color: #92928d;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .message {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: -.025em;
    }

    .line {
      width: 46px;
      height: 1px;
      margin: 38px auto 30px;
      background: #aaa9a3;
    }

    .word {
      color: #666661;
      font-size: clamp(.78rem, 2.4vw, .94rem);
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .signature {
      margin-top: 46px;
      color: #aaa9a4;
      font-size: .72rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    @keyframes arrive {
      from { opacity: .15; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Uma mensagem para você</div>
    <p class="message" id="message">Leve consigo aquilo que fez você permanecer.</p>
    <div class="line" aria-hidden="true"></div>
    <div class="word" id="word">PRESENÇA</div>
    <div class="signature">Você se vê?</div>
  </main>

  <script>
    const values = new URLSearchParams(location.hash.slice(1));
    const message = values.get("mensagem");
    const word = values.get("palavra");

    if (message) document.getElementById("message").textContent = message;
    if (word) document.getElementById("word").textContent = word;
  </script>
</body>
</html>
